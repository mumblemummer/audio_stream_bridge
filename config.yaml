name: "Audio Stream Bridge"
description: "YouTube Cast, AirPlay 및 DLNA 오디오 스트림을 수신하여 Home Assistant 및 Music Assistant 스피커로 실시간 중계하는 독립 오디오 브릿지"
version: "2.0.2"
slug: "audio_stream_bridge"
init: false
arch:
  - aarch64
  - amd64
startup: services
boot: auto
host_network: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:cast-connected"
panel_title: "Audio Bridge"
schema:
  speaker_name: str
  audio_sample_rate: str
options:
  speaker_name: "Audio Stream Bridge"
  audio_sample_rate: "44100:16:2"
